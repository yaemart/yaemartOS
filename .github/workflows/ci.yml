name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (api)
        working-directory: apps/api
        run: pnpm exec prisma generate
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test

      - name: Lint
        run: pnpm lint

      - name: Typecheck (web)
        run: pnpm --filter @yaemartos/web typecheck

      - name: Typecheck (api)
        run: pnpm --filter @yaemartos/api typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaemartos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (api)
        working-directory: apps/api
        run: pnpm exec prisma generate
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test

      - name: Run Prisma migrations (public)
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test

      - name: Run tenant schema migrations
        working-directory: apps/api
        run: pnpm run db:migrate:all-tenants
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test

      - name: Test (api)
        run: pnpm --filter @yaemartos/api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          GOOGLE_CALLBACK_URL: http://localhost:4000/auth/oauth/google/callback
          FACEBOOK_CLIENT_ID: dummy
          FACEBOOK_CLIENT_SECRET: dummy
          FACEBOOK_CALLBACK_URL: http://localhost:4000/auth/oauth/facebook/callback

      - name: Test (web)
        run: pnpm --filter @yaemartos/web test

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (web)
        run: pnpm --filter @yaemartos/web build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Build (api)
        run: pnpm --filter @yaemartos/api build

  e2e:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaemartos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms256m -Xmx256m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prisma generate (api)
        working-directory: apps/api
        run: pnpm exec prisma generate
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test

      - name: Run Prisma migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test

      - name: Run tenant schema migrations
        working-directory: apps/api
        run: pnpm run db:migrate:all-tenants
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test

      - name: Run E2E smoke tests
        run: pnpm exec playwright test tests/e2e/
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yaemartos_test
          PORT: 4000
          NODE_ENV: test
          GEMINI_API_KEY: mock-key-for-ci
          CLOUDINARY_CLOUD_NAME: mock
          CLOUDINARY_API_KEY: mock
          CLOUDINARY_API_SECRET: mock
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          GOOGLE_CALLBACK_URL: http://localhost:4000/auth/oauth/google/callback
          FACEBOOK_CLIENT_ID: dummy
          FACEBOOK_CLIENT_SECRET: dummy
          FACEBOOK_CALLBACK_URL: http://localhost:4000/auth/oauth/facebook/callback
          ELASTICSEARCH_URL: http://localhost:9200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
